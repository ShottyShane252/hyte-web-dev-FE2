<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dear Diary - My Diary</title>
    <link rel="stylesheet" href="/src/css/ddstyles.css" />
  </head>
  <body>

    <!-- Site Header -->
    <header class="site-header">
      <div class="header-content">
        <div class="logo">
          <h1>Dear Diary</h1>
          <p class="tagline">Your Personal Health Journal</p>
        </div>

        <nav class="main-nav">
          <ul class="nav-list">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="bmi.html" class="nav-link">BMI</a></li>
            <li><a href="diary.html" class="nav-link active">Diary</a></li>
            <li><a href="contacts.html" class="nav-link">Contact</a></li>
            <li><a href="login.html" class="nav-link">Login</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="hero-banner"></div>

    <!-- Main Content -->
    <main class="main-content">

      <section>
        <h2 class="page-title">My Daily Entry</h2>
        <p class="intro-text">
          Log your daily wellness, mood, and reflections below.
        </p>
      </section>

      <!-- Diary Form -->
      <section class="diary-form-section">
        <form id="diaryForm">

          <label for="entryDate">Date</label>
          <input type="date" id="entryDate" required />

          <label for="mood">Mood</label>
          <select id="mood" required>
            <option value="">Select mood</option>
            <option value="great">Great </option>
            <option value="good">Good </option>
            <option value="okay">Okay </option>
            <option value="bad">Bad </option>
          </select>

          <label for="sleep">Hours of Sleep</label>
          <input type="number" id="sleep" min="0" max="24" step="1" />

          <label for="notes">Daily Notes</label>

          <textarea id="notes" rows="3" placeholder="How was your day?"></textarea>

          <button type="submit" class="btn">Save Entry</button>
        </form>
      </section>

      <!-- Entries Display Section -->
      <section class="entries-section">
        <h3 class="section-title">Previous Entries</h3>

        <div class="entries-list">
          <!-- Entries will be inserted here dynamically -->
          <p>No entries yet.</p>
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p>&copy;Hanad Mahamuud</p>
      <p class="footer-note">Dear Diary - Your Personal Health Journal</p>
    </footer>

    <!-- Future JS -->
     <script type="module" src="/src/js/diary.js"></script>

  </body>
</html>
